# Builds the documentation site (site/, Astro Starlight) and publishes it to GitHub Pages at
# https://kushalr3ddy.github.io/whatsapp-crm/ . One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
# Runs only every night (and on demand from the Actions tab: "Run workflow"), never on a push or a pull request, so it uses no
# build minutes while you work. Merging a change to the site shows up at the next night's run, or immediately if you run it by hand.
# This is not a required check: it cannot block a merge.
name: docs-site

on:
  schedule:
    - cron: '30 21 * * *'   # 03:00 in India (UTC+5:30); a scheduled run uses the main branch
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: install
        working-directory: site
        run: npm ci
      - name: generate the endpoint reference from the code (docs/generated/ is git-ignored, so it is not in the checkout)
        run: node scripts/api-docs.mjs
      - name: copy it into the site
        working-directory: site
        run: node scripts/sync-generated.mjs
      - name: build
        working-directory: site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
